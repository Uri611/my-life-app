<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MY LIFE">
<title>MY LIFE · Control personal</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef2f8;background:#0b1018;font-size:15px}*{box-sizing:border-box}body{margin:0;padding-bottom:100px}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:920px;margin:auto;padding:24px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#93a4b9;text-transform:uppercase}h1{font-size:31px;margin:6px 0 8px}h2{font-size:19px;margin:0 0 16px}h3{font-size:15px;margin:0 0 10px}.muted{color:#94a3b8;font-size:13px}.card{background:#151e2b;border:1px solid #263344;border-radius:19px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0}.metric{font-size:25px;font-weight:750;margin:8px 0 4px}.accent{color:#73e5b1}.danger{color:#ff9e9e}.pill{background:#243547;border-radius:20px;padding:7px 10px;color:#d6e6f8;font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#101722f2;border-top:1px solid #263344;display:flex;justify-content:center;padding:9px 5px max(12px,env(safe-area-inset-bottom));z-index:3}.nav button{border:0;background:transparent;color:#93a4b9;padding:9px 16px;border-radius:12px;font-size:12px;min-width:75px}.nav button.active{color:#7ce4b7;background:#203c37}.tabs{display:flex;gap:7px;overflow:auto;margin:16px 0}.tabs button{border:1px solid #334255;border-radius:999px;background:#192534;color:#d5e0ed;padding:9px 14px;white-space:nowrap}.tabs button.active{background:#245444;border-color:#419c78}.primary{border:0;background:#73e5b1;color:#0b2018;border-radius:12px;padding:12px 17px;font-weight:700}.secondary{border:1px solid #35455a;background:#202d3d;color:#f3f6fa;border-radius:12px;padding:10px 13px}.small{font-size:12px;padding:7px 10px}.dangerbtn{color:#ffaaaa}label{display:block;color:#a9b8ca;font-size:12px;margin:12px 0 5px}input,select,textarea{width:100%;background:#0f1723;border:1px solid #34455a;border-radius:11px;color:#f6f8fa;padding:12px;outline:none}input:focus,select:focus{border-color:#73e5b1}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.entry{border-top:1px solid #2b394a;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.entry:first-child{border-top:0}.entry strong{display:block;margin-bottom:4px}.entry small{color:#92a4b8}.empty{padding:18px;text-align:center;color:#94a3b8}.chart{width:100%;height:170px}.bar{height:7px;background:#2a3948;border-radius:10px;overflow:hidden}.bar span{display:block;background:#73e5b1;height:100%}.hidden{display:none!important}.notice{font-size:12px;color:#c7d6e7;line-height:1.5}.tag{font-size:11px;color:#7ce4b7}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:10px}.icon{font-size:23px}@media(min-width:680px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.nav{max-width:920px;margin:auto;border-radius:18px 18px 0 0}.nav button{min-width:130px}}@media(max-width:390px){.nav button{padding:8px 7px;min-width:66px}.metric{font-size:21px}}
</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">EL TEU ESPAI PERSONAL</div><h1>MY LIFE <span class="accent">●</span></h1><div class="muted" id="today"></div></div><button class="secondary small" onclick="setTab('settings')">⚙ Còpies</button></div><div id="app"></div></main>
<nav class="nav" id="nav"><button data-tab="home" class="active" onclick="setTab('home')">⌂<br>Inici</button><button data-tab="sport" onclick="setTab('sport')">♢<br>Esport</button><button data-tab="money" onclick="setTab('money')">€<br>Finances</button><button data-tab="trade" onclick="setTab('trade')">↗<br>Trading</button></nav>
<script>
const KEY='mylife_v1';const empty=()=>({gym:[],bike:[],money:[],trade:[]});let db;try{db={...empty(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){db=empty()}
let tab='home',sub='gym',range='month',gymMode='list',tradeMode='list';
const $=s=>document.querySelector(s), app=()=>$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Number(n||0).toLocaleString('ca-ES',{style:'currency',currency:'EUR'});
const num=n=>Number(n||0).toLocaleString('ca-ES',{maximumFractionDigits:2});
const dateNow=()=>new Date().toLocaleDateString('en-CA');
const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('ca-ES',{day:'numeric',month:'short',year:'numeric'});
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No s’han pogut guardar les dades. Exporta una còpia.')}} 
function add(kind,rec){db[kind].push({...rec,id:id()});save();render()}
function remove(kind,uid){if(confirm('Vols eliminar aquest registre?')){db[kind]=db[kind].filter(x=>x.id!==uid);save();render()}}
function setTab(t){tab=t;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render();window.scrollTo(0,0)}
function setSub(s){sub=s;render()}
function setRange(r){range=r;render()}
function inRange(d,r=range){let t=new Date(d+'T12:00:00'),n=new Date();if(r==='all')return true;if(r==='week'){let start=new Date(n);start.setHours(0,0,0,0);start.setDate(start.getDate()-(start.getDay()+6)%7);return t>=start}if(r==='month')return t.getFullYear()===n.getFullYear()&&t.getMonth()===n.getMonth();return t.getFullYear()===n.getFullYear()}
const filtered=(a,r=range)=>a.filter(x=>inRange(x.date,r));
const sum=(a,f)=>a.reduce((s,x)=>s+Number(f(x)||0),0);
function stat(title,value,desc){return `<div class="card"><div class="muted">${title}</div><div class="metric">${value}</div><div class="muted">${desc||''}</div></div>`}
function buttons(items,sel,fn){return `<div class="tabs">${items.map(([k,v])=>`<button class="${sel===k?'active':''}" onclick="${fn}('${k}')">${v}</button>`).join('')}</div>`}
function period(){return buttons([['week','Setmana'],['month','Mes'],['year','Any'],['all','Tot']],range,'setRange')}
function emptyMsg(){return '<div class="empty">Encara no hi ha registres. Afegeix el primer!</div>'}
function entry(title,subtitle,kind,x,right=''){return `<div class="entry"><div><strong>${esc(title)}</strong><small>${esc(subtitle)}</small></div><div style="text-align:right">${right}<br><button class="secondary small dangerbtn" onclick="remove('${kind}','${x.id}')">Eliminar</button></div></div>`}
function chart(data,label='Evolució'){if(!data.length)return emptyMsg();let W=600,H=170,p=30,values=data.map(x=>Number(x.y)),lo=Math.min(...values),hi=Math.max(...values);if(lo===hi){lo=Math.max(0,lo-1);hi+=1}let pts=data.map((x,i)=>[p+i*(W-2*p)/Math.max(1,data.length-1),H-p-(x.y-lo)/(hi-lo)*(H-2*p)]);return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#526071"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#526071"/><text x="5" y="20" fill="#94a3b8" font-size="12">${num(hi)}</text><text x="5" y="${H-8}" fill="#94a3b8" font-size="12">${num(lo)}</text><polyline points="${pts.map(a=>a.join(',')).join(' ')}" fill="none" stroke="#73e5b1" stroke-width="3" stroke-linejoin="round"/>${pts.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="4" fill="#73e5b1"><title>${esc(data[i].x)}: ${num(data[i].y)}</title></circle>`).join('')}</svg><div class="muted" style="display:flex;justify-content:space-between"><span>${esc(data[0].x)}</span><span>${esc(data[data.length-1].x)}</span></div>`}
function home(){let gy=filtered(db.gym,'month'),bi=filtered(db.bike,'month'),mo=filtered(db.money,'month'),tr=filtered(db.trade,'month');let balance=sum(mo.filter(x=>x.type==='income'),x=>x.amount)-sum(mo.filter(x=>x.type==='expense'),x=>x.amount);return `<h2 style="margin-top:25px">El teu resum mensual</h2><div class="grid">${stat('Sessions de gimnàs',new Set(gy.map(x=>x.date)).size,'dies entrenats')}${stat('Bici',num(sum(bi,x=>x.km))+' km',bi.length+' sortides')}${stat('Balanç personal',eur(balance),'ingressos − despeses')}${stat('Operacions de trading',tr.length,'compres i vendes')}</div><div class="card"><h3>Comença per aquí</h3><p class="muted">Registra cada sèrie del gimnàs, cada ruta amb bici, els moviments de diners i les operacions d’inversió. Els resums es calculen automàticament.</p><div class="actions"><button class="primary" onclick="setTab('sport')">+ Esport</button><button class="secondary" onclick="setTab('money')">+ Finances</button><button class="secondary" onclick="setTab('trade')">+ Trading</button></div></div><div class="card"><h3>Pròximament</h3><p class="muted">El quart apartat queda pendent de decidir. Aquesta primera versió ja permet guardar registres i consultar evolucions.</p></div>`}
function sport(){let gy=filtered(db.gym),bi=filtered(db.bike);let sessions=new Set(gy.map(x=>x.date)).size;return `<h2 style="margin-top:24px">Esport</h2>${buttons([['gym','Gimnàs'],['bike','Bici'],['summary','Resums']],sub,'setSub')}${sub==='gym'?`<div class="card"><h3>Afegir sèrie d’exercici</h3><form onsubmit="addGym(event)"><div class="formgrid"><div class="full"><label>Exercici</label><input name="exercise" list="exercises" placeholder="Ex. Press banca" required maxlength="80"><datalist id="exercises">${[...new Set([...db.gym.map(x=>x.exercise),'Press banca','Sentadeta','Pes mort','Dominades','Curl bíceps','Premsa de cames','Rem amb barra'])].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>Data</label><input name="date" type="date" value="${dateNow()}" required></div><div><label>Número de sèrie</label><input name="set" type="number" min="1" step="1" value="1" required></div><div><label>Pes (kg)</label><input name="kg" type="number" min="0" step="0.25" required placeholder="50"></div><div><label>Repeticions</label><input name="reps" type="number" min="1" step="1" required placeholder="10"></div></div><div class="actions"><button class="primary">Guardar sèrie</button></div></form></div>${period()}<div class="grid">${stat('Dies de gimnàs',sessions,'període seleccionat')}${stat('Sèries',gy.length,'registrades')}${stat('Volum total',num(sum(gy,x=>x.kg*x.reps))+' kg','kg × repeticions')}${stat('Exercicis',new Set(gy.map(x=>x.exercise)).size,'diferents')}</div><div class="card"><h3>Evolució del pes per exercici</h3>${db.gym.length?`<select id="exerciseSelect" onchange="drawGymChart()">${[...new Set(db.gym.map(x=>x.exercise))].sort().map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><div id="gymChart"></div>`:emptyMsg()}</div><div class="card"><h3>Historial de sèries</h3>${gy.length?gy.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>entry(x.exercise,`${dateLabel(x.date)} · Sèrie ${x.set}`,'gym',x,`<strong>${num(x.kg)} kg × ${num(x.reps)}</strong>`)).join(''):emptyMsg()}</div>`:sub==='bike'?`<div class="card"><h3>Afegir ruta de bici</h3><form onsubmit="addBike(event)"><div class="formgrid"><div class="full"><label>Nom de la ruta</label><input name="name" placeholder="Ex. Volta per Osona" required maxlength="100"></div><div><label>Data</label><input name="date" type="date" value="${dateNow()}" required></div><div><label>Distància (km)</label><input name="km" type="number" min="0.01" step="0.01" required></div><div><label>Durada (minuts)</label><input name="minutes" type="number" min="1" step="1" required></div><div><label>Desnivell positiu (m)</label><input name="elevation" type="number" min="0" step="1" value="0"></div><div class="full"><label>Observacions (opcional)</label><textarea name="notes" rows="2"></textarea></div></div><button class="primary" style="margin-top:14px">Guardar ruta</button></form></div>${period()}<div class="grid">${stat('Sortides',bi.length)}${stat('Distància',num(sum(bi,x=>x.km))+' km')}${stat('Temps',num(sum(bi,x=>x.minutes)/60)+' h')}${stat('Desnivell',num(sum(bi,x=>x.elevation))+' m')}</div><div class="card"><h3>Rutes registrades</h3>${bi.length?bi.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>entry(x.name,`${dateLabel(x.date)} · ${num(x.minutes)} min · ${num(x.elevation)} m+ · ${num(x.km/(x.minutes/60))} km/h`,'bike',x,`<strong>${num(x.km)} km</strong>`)).join(''):emptyMsg()}</div></div>`:`${period()}<div class="grid">${stat('Dies de gimnàs',sessions)}${stat('Sèries',gy.length)}${stat('Sortides de bici',bi.length)}${stat('Km de bici',num(sum(bi,x=>x.km)))}</div><div class="card"><h3>Evolució de quilòmetres de bici per sortida</h3>${chart(bi.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>({x:dateLabel(x.date),y:Number(x.km)})),'Km per sortida')}</div><div class="card"><h3>Volum d’entrenament</h3><p class="muted">Volum total (pes × repeticions): <strong>${num(sum(gy,x=>x.kg*x.reps))} kg</strong></p><p class="muted">Canvia entre setmana, mes i any per comparar els teus registres.</p></div>`}`}
function drawGymChart(){let e=$('#exerciseSelect');if(!e)return;let xs=filtered(db.gym).filter(x=>x.exercise===e.value),groups={};xs.forEach(x=>groups[x.date]=Math.max(groups[x.date]||0,Number(x.kg)));$('#gymChart').innerHTML=chart(Object.keys(groups).sort().map(d=>({x:dateLabel(d),y:groups[d]})),'Pes màxim per sessió')}
function addGym(e){e.preventDefault();let f=new FormData(e.target);add('gym',{exercise:String(f.get('exercise')).trim(),date:f.get('date'),set:+f.get('set'),kg:+f.get('kg'),reps:+f.get('reps')})}
function addBike(e){e.preventDefault();let f=new FormData(e.target);add('bike',{name:String(f.get('name')).trim(),date:f.get('date'),km:+f.get('km'),minutes:+f.get('minutes'),elevation:+f.get('elevation'),notes:String(f.get('notes'))})}
function money(){let xs=filtered(db.money),income=sum(xs.filter(x=>x.type==='income'),x=>x.amount),expense=sum(xs.filter(x=>x.type==='expense'),x=>x.amount);return `<h2 style="margin-top:24px">Finances personals</h2><div class="card"><h3>Afegir moviment</h3><form onsubmit="addMoney(event)"><div class="formgrid"><div><label>Tipus</label><select name="type"><option value="expense">Despesa</option><option value="income">Ingrés</option></select></div><div><label>Import (€)</label><input type="number" name="amount" min="0.01" step="0.01" required></div><div><label>Data</label><input type="date" name="date" value="${dateNow()}" required></div><div><label>Categoria</label><select name="category">${['Nòmina','Menjar','Transport','Oci','Compres','Habitatge','Salut','Subscripcions','Altres'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="full"><label>Concepte</label><input name="note" placeholder="Ex. Compra supermercat" required maxlength="120"></div></div><button class="primary" style="margin-top:14px">Guardar moviment</button></form></div>${period()}<div class="grid">${stat('Ingressos',eur(income))}${stat('Despeses',eur(expense))}${stat('Balanç',`<span class="${income-expense>=0?'accent':'danger'}">${eur(income-expense)}</span>`)}${stat('Moviments',xs.length)}</div><div class="card"><h3>Despeses per categoria</h3>${expense?Object.entries(xs.filter(x=>x.type==='expense').reduce((a,x)=>(a[x.category]=(a[x.category]||0)+Number(x.amount),a),{})).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin:13px 0"><div class="sectiontitle"><span>${esc(k)}</span><strong>${eur(v)}</strong></div><div class="bar" style="margin-top:7px"><span style="width:${v/expense*100}%"></span></div></div>`).join(''):emptyMsg()}</div><div class="card"><h3>Moviments</h3>${xs.length?xs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>entry(x.note,`${dateLabel(x.date)} · ${x.category}`,'money',x,`<strong class="${x.type==='income'?'accent':'danger'}">${x.type==='income'?'+':'−'}${eur(x.amount)}</strong>`)).join(''):emptyMsg()}</div>`}
function addMoney(e){e.preventDefault();let f=new FormData(e.target);add('money',{type:f.get('type'),amount:+f.get('amount'),date:f.get('date'),category:f.get('category'),note:String(f.get('note')).trim()})}
function tradeCalc(){let by={};db.trade.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).forEach(x=>{let k=x.asset.trim().toUpperCase(),b=by[k]||(by[k]={qty:0,cost:0,realized:0,fees:0,operations:0});let q=Number(x.qty),price=Number(x.price),fee=Number(x.fee||0);b.operations++;b.fees+=fee;if(x.type==='buy'){b.qty+=q;b.cost+=q*price+fee}else{let avg=b.qty>0?b.cost/b.qty:0;let cost=q*avg;b.realized+=q*price-fee-cost;b.qty-=q;b.cost-=cost;if(Math.abs(b.qty)<1e-8){b.qty=0;b.cost=0}}});return by}
function trading(){let xs=filtered(db.trade),hold=tradeCalc(),realized=sum(Object.values(hold),x=>x.realized);return `<h2 style="margin-top:24px">Trading · Trade Republic</h2><div class="card"><h3>Registrar operació</h3><form onsubmit="addTrade(event)"><div class="formgrid"><div><label>Tipus</label><select name="type"><option value="buy">Compra</option><option value="sell">Venda</option></select></div><div><label>Data</label><input type="date" name="date" value="${dateNow()}" required></div><div class="full"><label>Actiu (nom o ticker)</label><input name="asset" required maxlength="80" placeholder="Ex. VWCE, AAPL, BTC" list="assets"><datalist id="assets">${Object.keys(hold).map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div><div><label>Quantitat</label><input name="qty" type="number" min="0.00000001" step="any" required></div><div><label>Preu per unitat (€)</label><input name="price" type="number" min="0" step="any" required></div><div><label>Comissions (€)</label><input name="fee" type="number" min="0" step="0.01" value="0" required></div></div><button class="primary" style="margin-top:14px">Guardar operació</button></form><p class="notice">Registra les compres abans que les vendes. Les vendes es calculen amb el cost mitjà ponderat de les compres registrades. Imports en euros; no s'inclouen impostos ni dividends.</p></div>${period()}<div class="grid">${stat('Operacions',xs.length,'en el període')}${stat('Compres',eur(sum(xs.filter(x=>x.type==='buy'),x=>x.qty*x.price+x.fee)))}${stat('Vendes',eur(sum(xs.filter(x=>x.type==='sell'),x=>x.qty*x.price-x.fee)))}${stat('Guany realitzat',`<span class="${realized>=0?'accent':'danger'}">${eur(realized)}</span>`,'històric total')}</div><div class="card"><h3>Posicions i resultats històrics</h3>${Object.keys(hold).length?Object.entries(hold).map(([name,b])=>`<div class="entry"><div><strong>${esc(name)}</strong><small>${num(b.qty)} unitats · Cost restant ${eur(b.cost)}</small></div><div style="text-align:right"><strong class="${b.realized>=0?'accent':'danger'}">${eur(b.realized)}</strong><small>Guany/pèrdua realitzat</small></div></div>`).join(''):emptyMsg()}<p class="notice">El valor actual de les posicions obertes no es calcula sense cotitzacions de mercat.</p></div><div class="card"><h3>Historial d'operacions</h3>${xs.length?xs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>entry(`${x.type==='buy'?'Compra':'Venda'} · ${x.asset}`,`${dateLabel(x.date)} · ${num(x.qty)} unitats a ${eur(x.price)} · Comissió ${eur(x.fee)}`,'trade',x,`<strong>${eur(x.qty*x.price)}</strong>`)).join(''):emptyMsg()}</div>`}
function addTrade(e){e.preventDefault();let f=new FormData(e.target),asset=String(f.get('asset')).trim().toUpperCase(),type=f.get('type'),qty=+f.get('qty'),date=f.get('date');if(type==='sell'){let previous=db.trade.filter(x=>x.asset.trim().toUpperCase()===asset&&x.date<=date),available=sum(previous.filter(x=>x.type==='buy'),x=>x.qty)-sum(previous.filter(x=>x.type==='sell'),x=>x.qty);if(qty>available+1e-8){alert('No tens prou unitats comprades registrades abans d’aquesta data.');return}}add('trade',{asset,type,qty,date,price:+f.get('price'),fee:+f.get('fee')})}
function settings(){return `<h2 style="margin-top:24px">Dades i còpies de seguretat</h2><div class="card"><h3>Les teves dades</h3><p class="notice">Aquesta primera versió desa els registres al navegador del dispositiu (localStorage). No els envia a cap servidor. Si esborres les dades del navegador o canvies de mòbil, els pots perdre. Fes còpies de seguretat regularment.</p><div class="actions"><button class="primary" onclick="exportData()">↓ Exportar còpia JSON</button><label class="secondary" style="margin:0;cursor:pointer">↑ Importar còpia<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div></div><div class="card"><h3>Estat de l'app</h3><p class="muted">Versió inicial · 3 apartats actius · quart apartat pendent.</p><p class="notice">Per tenir-la com una app instal·lable amb experiència completa a l'iPhone, caldrà publicar-la amb HTTPS i afegir els fitxers de configuració PWA. Aquest fitxer HTML es pot provar ara mateix en un navegador.</p></div>`}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mylife-copia-'+dateNow()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text()),v=obj.data||obj;if(!['gym','bike','money','trade'].every(k=>Array.isArray(v[k])))throw Error('Format incorrecte');if(confirm('Substituir totes les dades actuals per les de la còpia?')){db=v;save();render()}}catch(err){alert('No es pot importar el fitxer: '+err.message)}}
function render(){app().innerHTML=tab==='home'?home():tab==='sport'?sport():tab==='money'?money():tab==='trade'?trading():settings();if(tab==='sport'&&sub==='gym')drawGymChart()}
$('#today').textContent=new Date().toLocaleDateString('ca-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});render();
