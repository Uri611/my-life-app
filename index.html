<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10182b"><title>MY LIFE V6</title><style>
:root{color-scheme:dark;--bg:#0a1020;--panel:#141e32;--panel2:#1c2941;--line:#34435b;--txt:#f4f7fc;--muted:#a7b6cd;--accent:#72c8ff;--green:#65d7ae;--red:#ff858e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,-apple-system,Arial,sans-serif}header{padding:22px 16px 12px;max-width:1000px;margin:auto}h1{font-size:28px;margin:0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 12px}p{color:var(--muted);line-height:1.5}.sub{color:var(--muted);font-size:13px}nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 15px;max-width:1000px;margin:auto}button,.tab{border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:11px 14px;border-radius:12px;font:inherit;cursor:pointer;white-space:normal}button.primary,.tab.active{background:#245d86;border-color:#439bcd}button.danger{border-color:#a45c66;color:#ffb7bd}button:disabled{opacity:.45}main{max-width:1000px;margin:auto;padding:0 16px 80px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;margin:0 0 14px;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid>*{min-width:0}.field{min-width:0;display:flex;flex-direction:column;gap:5px}.field label{color:var(--muted);font-size:13px}input,select,textarea{display:block;width:100%;min-width:0;max-width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:11px 10px;background:#0d1628;color:var(--txt);font:inherit;appearance:auto}input[type=date],input[type=time],input[type=number]{min-width:0}textarea{min-height:75px;resize:vertical}.wide{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pill{display:inline-block;background:#203b50;color:#a9e2ff;padding:4px 9px;border-radius:20px;font-size:12px}.item{border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.item:first-child{border-top:0}.item>div{min-width:0}.item small{display:block;color:var(--muted);margin-top:4px}.num{font-size:24px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:var(--panel2);padding:12px;border-radius:12px;min-width:0}.stat small{display:block;color:var(--muted);margin-bottom:6px}.stat strong{font-size:21px;overflow-wrap:anywhere}.hide{display:none!important}.notice{border-left:3px solid var(--accent);padding:10px;background:#162c40;border-radius:7px;color:#dceefe;margin-bottom:12px}.error{color:var(--red)}.success{color:var(--green)}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.sectiontabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px}.sectiontabs button{flex:1}.exercise{border:1px solid var(--line);padding:12px;border-radius:12px;margin-bottom:10px}.setrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto;gap:8px;align-items:end;margin:8px 0}.setrow .field{min-width:0}.setrow button{padding:10px}.chart{display:flex;align-items:end;gap:8px;height:120px;border-bottom:1px solid var(--line);padding-top:10px}.bar{flex:1;background:#368ac0;border-radius:5px 5px 0 0;min-width:6px;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}@media(max-width:520px){.grid{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.setrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto}.item{align-items:flex-start}.item button{font-size:12px;padding:8px}header{padding-top:16px}}@media(max-width:350px){.stats{grid-template-columns:1fr}.setrow{gap:4px}.setrow button{padding:8px 6px}}

/* Barra inferior fixa, amb les quatre seccions principals */
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
nav#nav{position:fixed;z-index:100;left:0;right:0;bottom:0;max-width:none;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:#111b2d;border-top:1px solid var(--line);overflow:visible}

.navicon{font-size:23px;line-height:1.1}
header{position:relative;padding-right:125px}
.privacy-shortcut{position:absolute;right:16px;top:19px;padding:8px 10px;font-size:12px}
/* Evita que els controls de data d'iOS desbordin les columnes */
.grid,.field,.card,form{min-width:0;max-width:100%}
.grid>*{min-width:0;max-width:100%}
.field input,.field select,.field textarea{display:block;width:100%;max-width:100%;min-width:0;box-sizing:border-box}

input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;min-width:0}

@media(max-width:600px){.grid{grid-template-columns:minmax(0,1fr)!important}main{padding-bottom:20px}}

/* V4: formularis, gràfiques i calendari esportiu */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.calhead button{padding:8px 13px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calweekday{text-align:center;color:var(--muted);font-size:12px;padding:5px 0}
.calday{min-width:0;min-height:58px;padding:5px 1px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:13px}
.calday.active{border-color:var(--green);background:#1b413b}.calday.selected{outline:2px solid var(--accent)}
.calicons{font-size:11px;line-height:1.3;overflow-wrap:anywhere;text-align:center}
.monthbar{display:flex;height:13px;border-radius:8px;overflow:hidden;background:#27354a;margin:8px 0}
.monthbar>span{background:var(--green);height:100%;display:block}
.monthrow{display:grid;grid-template-columns:46px minmax(0,1fr) 85px;gap:9px;align-items:center;margin:10px 0;font-size:13px}
.monthrow small{text-align:right;overflow-wrap:anywhere}
@media(max-width:400px){.calday{min-height:52px;font-size:12px}.calicons{font-size:10px}.sectiontabs button{font-size:12px;padding:10px 7px}}

body.locked header{padding-right:16px}body.locked main{max-width:520px;padding-top:25px}
.authlogo{text-align:center;font-size:42px;margin:12px 0}.authhint{text-align:center}
</style></head><body class="locked"><header><h1>MY LIFE <span class="pill">V6</span></h1><div class="sub" id="syncstatus">Dades desades en aquest dispositiu</div><button type="button" id="privacyShortcut" class="privacy-shortcut">🔒 Privacitat</button></header><nav id="nav"></nav><main id="app"></main><script>
'use strict';
const KEY='mylife_v3',CLOUD_KEY='mylife_v3_cloud'; // Mateixa clau: conserva les dades V3
const empty=()=>({bike:[],running:[],money:[],trade:[],routines:[],workouts:[],cashflows:[],interest:[]});
const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const today=()=>new Date().toLocaleDateString('en-CA');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>Number(x)||0,fmt=(x,d=2)=>n(x).toLocaleString('ca-ES',{maximumFractionDigits:d,minimumFractionDigits:d});

const precise=x=>n(x).toLocaleString('ca-ES',{maximumFractionDigits:10});
let interestEditing=null;
 let db=empty(),page='Inici',sport='Gimnàs',editing=null,activeWorkout=null,restEnd=0,restTicker=null,calendarMonth=today().slice(0,7),calendarSelected=today();
// V5 no mostra dades locals abans de validar la sessió.

const legacyData=()=>{try{let v=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('mylife_v1')||'null');return v&&typeof v==='object'&&Object.keys(empty()).some(k=>Array.isArray(v[k]))?normalize(v):null;}catch{return null;}};
const normalize=v=>{let result={...empty(),...v};for(const k of Object.keys(empty()))if(!Array.isArray(result[k]))result[k]=[];return result;};
const hasData=v=>Object.keys(empty()).some(k=>Array.isArray(v?.[k])&&v[k].length);
let authenticated=false,ready=false,currentUser='',dataDirty=false,loadGeneration=0;
const save=()=>{if(!authenticated||!ready)return;dataDirty=true;scheduleSync();};
const el=()=>document.getElementById('app');
const field=(label,name,type='text',value='',extra='')=>`<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const select=(label,name,opts,value='')=>`<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}">${opts.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
const val=name=>document.getElementById(name)?.value??'';
const submit=fn=>{document.querySelector('form#entry')?.addEventListener('submit',e=>{e.preventDefault();fn();});};
const navs=['Inici','Esport','Finances','Inversions'];const navIcons={'Inici':'⌂','Esport':'🏋️','Finances':'💳','Inversions':'📈'};
function render(){if(!authenticated||!ready){showGate();return;}document.body.classList.remove('locked');document.getElementById('nav').innerHTML=navs.map(x=>`<button class="tab ${page===x?'active':''}" data-page="${x}"><span class="navicon">${navIcons[x]}</span><span>${x}</span></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;editing=null;interestEditing=null;render();});document.getElementById('privacyShortcut').onclick=()=>{page='Privacitat';editing=null;render();};({Inici:home,Esport:sports,Finances:finances,Inversions:investments,Privacitat:privacy})[page]();}
function home(){let km=db.bike.reduce((s,x)=>s+n(x.km),0),run=db.running.reduce((s,x)=>s+n(x.km),0),balance=db.money.reduce((s,x)=>s+(x.type==='Ingrés'?1:-1)*n(x.amount),0);el().innerHTML=`<div class="card"><h2>El teu resum</h2><div class="stats"><div class="stat"><small>Gimnàs · sessions</small><strong>${db.workouts.length}</strong></div><div class="stat"><small>Bici · km</small><strong>${fmt(km,1)}</strong></div><div class="stat"><small>Running · km</small><strong>${fmt(run,1)}</strong></div><div class="stat"><small>Saldo registrat</small><strong>${money(balance)}</strong></div></div></div><div class="card"><h2>MY LIFE V6</h2><p>Registra entrenaments, sortides, finances i inversions. Pots exportar les dades a Privacitat.</p></div>`;}
function sports(){el().innerHTML=`<div class="sectiontabs">${['Gimnàs','Bici','Running','Calendari'].map(s=>`<button class="${sport===s?'primary':''}" data-sport="${s}">${s}</button>`).join('')}</div><div id="sportbody"></div>`;document.querySelectorAll('[data-sport]').forEach(b=>b.onclick=()=>{sport=b.dataset.sport;editing=null;sports();});if(sport==='Gimnàs')gym();else if(sport==='Calendari')sportCalendar();else cardio(sport==='Bici'?'bike':'running');}
function cardio(kind){const bike=kind==='bike',title=bike?'Bici':'Running',a=db[kind],edit=a.find(x=>x.id===editing),km=a.reduce((s,x)=>s+n(x.km),0),seconds=a.reduce((s,x)=>s+n(x.seconds||n(x.hours)*3600+n(x.minutes)*60),0),speed=seconds?km/(seconds/3600):0;
 document.getElementById('sportbody').innerHTML=`<div class="card"><h2>${edit?'Editar':'Nova'} sortida · ${title}</h2><form id="entry"><div class="grid">${field('Data','date','date',edit?.date||today(),'required')}${field('Distància (km)','km','number',edit?.km||'','min="0.01" step="0.01" required')}${field('Hores','hours','number',edit?.hours??0,'min="0" step="1"')}${field('Minuts','minutes','number',edit?.minutes??0,'min="0" max="59" step="1"')}${field('Segons','seconds','number',edit?.secondsPart??0,'min="0" max="59" step="1"')}${field('Desnivell positiu (m)','elevation','number',edit?.elevation||'','min="0" step="1"')}${field('Velocitat mitjana (km/h) · automàtica si es deixa buit','speed','number',edit?.manualSpeed||'','min="0" step="0.01"')}${bike?'':`<div class="field"><label>Ritme mitjà (min/km)</label><input id="pace" readonly placeholder="Es calcula automàticament"></div>`}<div class="field wide"><label>Notes</label><textarea id="notes">${esc(edit?.notes||'')}</textarea></div></div><div class="actions"><button class="primary" type="submit">${edit?'Desar canvis':'Guardar sortida'}</button>${edit?'<button type="button" id="cancel">Cancel·lar</button>':''}</div></form></div><div class="card"><h2>Estadístiques</h2><div class="stats"><div class="stat"><small>Sortides</small><strong>${a.length}</strong></div><div class="stat"><small>Distància total</small><strong>${fmt(km,1)} km</strong></div><div class="stat"><small>Velocitat global</small><strong>${fmt(speed,1)} km/h</strong></div><div class="stat"><small>Temps total</small><strong>${fmt(seconds/3600,1)} h</strong></div></div></div><div class="card"><h2>Historial</h2>${a.length?a.slice().sort((x,y)=>y.date.localeCompare(x.date)).map(x=>{let sec=n(x.seconds||n(x.hours)*3600+n(x.minutes)*60),v=n(x.manualSpeed)|| (sec?n(x.km)*3600/sec:0);return `<div class="item"><div><strong>${esc(x.date)} · ${fmt(x.km,2)} km</strong><small>${Math.floor(sec/3600)} h ${Math.floor(sec%3600/60)} min ${sec%60} s · ${fmt(v,1)} km/h${!bike&&n(x.km)?' · '+fmt(sec/60/n(x.km),2)+' min/km':''} · +${fmt(x.elevation,0)} m</small><small>${esc(x.notes)}</small></div><div class="actions"><button data-edit="${x.id}">Editar</button><button class="danger" data-del="${x.id}">×</button></div></div>`}).join(''):'<p>Encara no hi ha sortides.</p>'}</div>`;
 const updatePace=()=>{let sec=n(val('hours'))*3600+n(val('minutes'))*60+n(val('seconds')),km=n(val('km'));let p=document.getElementById('pace');if(p)p.value=sec&&km?fmt(sec/60/km,2):'';};['hours','minutes','seconds','km'].forEach(x=>document.getElementById(x)?.addEventListener('input',updatePace));updatePace();
 submit(()=>{let seconds=n(val('hours'))*3600+n(val('minutes'))*60+n(val('seconds'));if(!seconds&&!n(val('speed'))){alert('Introdueix el temps o la velocitat mitjana.');return;}let rec={id:edit?.id||id(),date:val('date'),km:n(val('km')),hours:n(val('hours')),minutes:n(val('minutes')),secondsPart:n(val('seconds')),seconds:seconds||Math.round(n(val('km'))/n(val('speed'))*3600),elevation:n(val('elevation')),manualSpeed:n(val('speed')),notes:val('notes')};if(edit)Object.assign(edit,rec);else a.push(rec);editing=null;save();sports();});
 document.getElementById('cancel')?.addEventListener('click',()=>{editing=null;sports();});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;sports();});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Eliminar aquesta sortida?')){db[kind]=db[kind].filter(x=>x.id!==b.dataset.del);save();sports();}});
}
function sportCalendar(){let events=new Map();const add=(date,type,label)=>{if(!date)return;let k=date.slice(0,10);if(!events.has(k))events.set(k,[]);events.get(k).push({type,label});};
 db.workouts.forEach(w=>add(w.date,'gym',`Gimnàs · ${esc(w.name||'Entrenament')}${w.duration?' · '+Math.round(n(w.duration)/60)+' min':''}`));
 db.bike.forEach(x=>add(x.date,'bike',`Bici · ${fmt(x.km,1)} km`));db.running.forEach(x=>add(x.date,'run',`Running · ${fmt(x.km,1)} km`));
 let [yy,mm]=calendarMonth.split('-').map(Number);if(!yy||mm<1||mm>12){calendarMonth=today().slice(0,7);[yy,mm]=calendarMonth.split('-').map(Number);}let count=new Date(yy,mm,0).getDate(),offset=(new Date(yy,mm-1,1).getDay()+6)%7,icons={gym:'🏋️',bike:'🚴',run:'🏃'},active=[...events.keys()].filter(k=>k.startsWith(calendarMonth)).length,items=events.get(calendarSelected)||[];
 document.getElementById('sportbody').innerHTML=`<div class="card"><h2>Calendari esportiu</h2><div class="calhead"><button id="calprev" type="button">‹</button><strong>${new Date(yy,mm-1,1).toLocaleDateString('ca-ES',{month:'long',year:'numeric'})}</strong><button id="calnext" type="button">›</button></div><div class="calendar">${['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map(x=>`<div class="calweekday">${x}</div>`).join('')}${Array.from({length:offset},()=>'<div></div>').join('')}${Array.from({length:count},(_,i)=>{let date=calendarMonth+'-'+String(i+1).padStart(2,'0'),acts=events.get(date)||[];return `<button type="button" class="calday ${acts.length?'active':''} ${date===calendarSelected?'selected':''}" data-day="${date}"><span>${i+1}</span><span class="calicons">${[...new Set(acts.map(a=>icons[a.type]))].join('')}</span></button>`;}).join('')}</div><p class="sub">🏋️ Gimnàs · 🚴 Bici · 🏃 Running · Els dies sense registre queden en blanc.</p><div class="stats"><div class="stat"><small>Dies amb esport aquest mes</small><strong>${active}</strong></div><div class="stat"><small>Dies sense activitat registrada</small><strong>${count-active}</strong></div></div></div><div class="card"><h2>${calendarSelected.split('-').reverse().join('/')} · Activitats</h2>${items.length?items.map(x=>`<div class="item"><div>${icons[x.type]} ${x.label}</div></div>`).join(''):'<p>No hi ha cap activitat registrada aquest dia.</p>'}</div>`;
 document.getElementById('calprev').onclick=()=>{let d=new Date(yy,mm-2,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');calendarSelected=calendarMonth+'-01';sportCalendar();};document.getElementById('calnext').onclick=()=>{let d=new Date(yy,mm,1);calendarMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');calendarSelected=calendarMonth+'-01';sportCalendar();};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{calendarSelected=b.dataset.day;sportCalendar();});}
function gym(){let root=document.getElementById('sportbody');let routines=db.routines;root.innerHTML=`<div class="card"><h2>Rutines de gimnàs</h2><form id="entry"><div class="grid">${field('Nom de la rutina','rname','text','','required')}<div class="field"><label>Exercicis (un per línia)</label><textarea id="exnames" placeholder="Press banca&#10;Sentadilles&#10;Dominades" required></textarea></div></div><div class="actions"><button class="primary" type="submit">Crear rutina</button></div></form></div>${routines.map(r=>`<div class="card"><h3>${esc(r.name)}</h3><p>${(r.exercises||[]).map(x=>esc(typeof x==='string'?x:x.name)).join(' · ')}</p><div class="actions"><button class="primary" data-start="${r.id}">Començar entrenament</button><button data-rename="${r.id}">Canviar nom</button><button data-addex="${r.id}">Afegir exercici</button><button class="danger" data-rdel="${r.id}">Eliminar rutina</button></div></div>`).join('')}${activeWorkout?`<div class="card" id="workcard"></div>`:''}<div class="card"><h2>Historial d'entrenaments</h2>${db.workouts.slice().reverse().map(w=>`<div class="item"><div><strong>${esc(w.name||'Entrenament')}</strong><small>${esc(w.date||'')} · ${w.duration?Math.round(w.duration/60)+' min':''}</small><small>${(w.exercises||[]).map(e=>esc(e.name)+': '+(e.sets||[]).filter(s=>s.done).length+' sèries').join(' · ')}</small></div><button class="danger" data-wdel="${w.id}">×</button></div>`).join('')||'<p>Encara no hi ha entrenaments.</p>'}</div>`;
 submit(()=>{let name=val('rname').trim(),ex=val('exnames').split('\n').map(s=>s.trim()).filter(Boolean);if(!name||!ex.length)return;routines.push({id:id(),name,exercises:ex.map(name=>({id:id(),name}))});save();gym();});
 root.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{if(activeWorkout&&!confirm('Substituir entrenament en curs?'))return;let r=routines.find(x=>x.id===b.dataset.start);activeWorkout={id:id(),name:r.name,date:today(),start:Date.now(),exercises:(r.exercises||[]).map(x=>({id:id(),name:typeof x==='string'?x:x.name,sets:[{id:id(),kg:'',reps:'',done:false}]}))};gym();});
 root.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{let r=routines.find(x=>x.id===b.dataset.rename),v=prompt('Nom nou',r.name);if(v?.trim()){r.name=v.trim();save();gym();}});
 root.querySelectorAll('[data-addex]').forEach(b=>b.onclick=()=>{let r=routines.find(x=>x.id===b.dataset.addex),v=prompt('Nom de l’exercici');if(v?.trim()){r.exercises.push({id:id(),name:v.trim()});save();gym();}});
 root.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminar rutina?')){db.routines=routines.filter(r=>r.id!==b.dataset.rdel);save();gym();}});

function showGate(message=''){document.body.classList.add('locked');document.getElementById('nav').innerHTML='';document.getElementById('syncstatus').textContent='🔒 Accés protegit';el().innerHTML=`<div class="card"><div class="authlogo">🔒</div><h2 style="text-align:center">Benvingut a MY LIFE</h2><p class="authhint">Inicia sessió per accedir a les teves dades.</p><form id="gateform"><div class="grid">${field('Correu electrònic','gateemail','email',cloud.email,'autocomplete="username" required')}${field('Contrasenya','gatepassword','password','','autocomplete="current-password" required')}</div><div class="actions"><button class="primary" type="submit">Entrar</button><button id="gatesignup" type="button">Crear compte</button></div></form><p id="gatemsg" class="sub">${esc(message)}</p></div>${!cloud.url||!cloud.anon?`<div class="card"><h3>Configurar Supabase</h3><p>Introdueix la configuració pública del teu projecte per connectar-te.</p>${field('URL del projecte','gateurl','url',cloud.url)}${field('Clau pública anon / publishable','gateanon','text',cloud.anon)}<div class="actions"><button id="gateconfig">Guardar configuració</button></div></div>`:''}`;
 document.getElementById('gateform').onsubmit=async e=>{e.preventDefault();let m=document.getElementById('gatemsg');m.textContent='Comprovant sessió...';try{await login(val('gateemail'),val('gatepassword'));await openAccount();}catch(err){m=document.getElementById('gatemsg');if(m)m.textContent='Error: '+err.message;}};
 document.getElementById('gatesignup').onclick=async()=>{let m=document.getElementById('gatemsg');try{if(!val('gateemail')||!val('gatepassword'))throw Error('Introdueix el correu i una contrasenya.');await request('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:val('gateemail'),password:val('gatepassword')})});m.textContent='Revisa el correu de confirmació i després prem Entrar.';}catch(err){m.textContent='Error: '+err.message;}};
 document.getElementById('gateconfig')?.addEventListener('click',()=>{cloud.url=val('gateurl').trim();cloud.anon=val('gateanon').trim();cloudSave();showGate('Configuració guardada. Ja pots iniciar sessió.');});
}
async function request(path,options={}){if(!cloud.url||!cloud.anon)throw Error('Configura Supabase primer.');let r=await fetch(cloud.url.replace(/\/$/,'')+path,{...options,headers:{apikey:cloud.anon,'Content-Type':'application/json',...(cloud.access?{Authorization:'Bearer '+cloud.access}:{}),...options.headers}});let raw=await r.text(),v;try{v=JSON.parse(raw);}catch{v=raw;}if(!r.ok)throw Error(v?.msg||v?.message||v?.error_description||'Error '+r.status);return v;}
async function login(email,password){let data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});cloud.email=email;cloud.access=data.access_token;cloud.refresh=data.refresh_token;cloud.expires=Date.now()+data.expires_in*1000;cloudSave();}
async function refreshAuth(){if(!cloud.refresh)throw Error('Inicia sessió');if(Date.now()<cloud.expires-60000)return;let d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloud.refresh})});cloud.access=d.access_token;cloud.refresh=d.refresh_token;cloud.expires=Date.now()+d.expires_in*1000;cloudSave();}
async function cloudPull(){await refreshAuth();let data=await request('/rest/v1/life_data?select=payload,updated_at&limit=1');if(data.length&&data[0].payload){db=normalize(data[0].payload);dataDirty=false;return true;}return false;}
async function openAccount(){const generation=++loadGeneration;authenticated=false;ready=false;showGate('Carregant dades del núvol...');try{await refreshAuth();let user=await request('/auth/v1/user');if(generation!==loadGeneration)return;currentUser=user.id;let found=await cloudPull();if(generation!==loadGeneration)return;
 if(!found){db=empty();let old=legacyData();if(old&&hasData(old)&&confirm('No hi ha dades al núvol. Vols recuperar les dades antigues d’aquest dispositiu?')){db=old;dataDirty=true;}}
 authenticated=true;ready=true;page='Inici';render();status(found?'Dades recuperades del núvol':'Sessió iniciada · núvol sense dades');if(dataDirty)scheduleSync();
 }catch(err){if(generation!==loadGeneration)return;authenticated=false;ready=false;db=empty();showGate('No s’han pogut carregar les dades: '+err.message);}}
async function cloudPush(){if(!authenticated||!ready||!cloud.access||syncBusy||!dataDirty)return;syncBusy=true;clearTimeout(syncTimer);let snapshot=JSON.stringify(db);try{await refreshAuth();await request('/rest/v1/life_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:currentUser,payload:JSON.parse(snapshot),updated_at:new Date().toISOString()})});if(JSON.stringify(db)===snapshot)dataDirty=false;status('Sincronitzat al núvol · '+new Date().toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'}));}catch(err){status('Error de sincronització: '+err.message);}finally{syncBusy=false;if(dataDirty&&authenticated&&ready)scheduleSync(12000);}}
function scheduleSync(delay=1100){if(!authenticated||!ready)return;clearTimeout(syncTimer);syncTimer=setTimeout(cloudPush,delay);}
function signout(){++loadGeneration;clearTimeout(syncTimer);authenticated=false;ready=false;db=empty();activeWorkout=null;currentUser='';dataDirty=false;cloud.access='';cloud.refresh='';cloud.expires=0;cloudSave();showGate('Sessió tancada.');}
function privacy(){el().innerHTML=`<div class="card"><h2>Privacitat i sincronització</h2><div class="notice">Les dades del núvol estan protegides amb les polítiques RLS de Supabase. L'accés a MY LIFE requereix una sessió vàlida. La sessió es recorda en aquest navegador. Un dispositiu desbloquejat amb la sessió activa pot accedir a les dades.</div><h3>Còpia de seguretat</h3><div class="actions"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><input class="hide" id="importfile" type="file" accept="application/json,.json"></div><p class="sub">El JSON no està xifrat. Desa'l en un lloc segur.</p></div><div class="card"><h2>El teu compte</h2><p>${esc(cloud.email||'Sessió iniciada')}</p><div class="actions"><button class="danger" id="signout">Tancar sessió</button></div></div><div class="card"><h2>Sincronització</h2><p class="sub">Les dades es recuperen en iniciar sessió i es desen automàticament després de cada canvi. Evita editar en dos dispositius alhora: l'última versió desada pot substituir l'anterior.</p><div class="actions"><button id="push">Sincronitzar ara</button><button id="pull">Recuperar dades del núvol</button></div><p id="syncmsg" class="sub"></p></div>`;
 document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-life-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 document.getElementById('import').onclick=()=>document.getElementById('importfile').click();document.getElementById('importfile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let v=JSON.parse(await f.text());if(!v||typeof v!=='object'||!Object.keys(empty()).some(k=>Array.isArray(v[k])))throw Error('Format incorrecte');if(confirm('Substituir les dades del compte amb aquesta còpia?')){db=normalize(v);save();render();}}catch(err){alert('No s’ha pogut importar: '+err.message);}};
 document.getElementById('signout').onclick=()=>{if(dataDirty&&!confirm('Hi ha canvis pendents de sincronitzar. Vols tancar sessió igualment?'))return;signout();};
 let sm=x=>{let e=document.getElementById('syncmsg');if(e)e.textContent=x;};
 document.getElementById('push').onclick=async()=>{dataDirty=true;sm('Sincronitzant...');await cloudPush();sm(document.getElementById('syncstatus').textContent);};
 document.getElementById('pull').onclick=async()=>{if(dataDirty){sm('Hi ha canvis locals pendents. Espera que se sincronitzin abans de recuperar dades.');return;}if(!confirm('Recuperar les dades del núvol?'))return;try{sm('Recuperant...');let found=await cloudPull();if(found){render();status('Dades recuperades del núvol');}else sm('No hi ha dades al núvol.');}catch(err){sm('Error: '+err.message);}};
}
showGate('Comprovant la sessió desada...');
if(cloud.refresh&&cloud.url&&cloud.anon)openAccount();else showGate();
</script></body></html>
