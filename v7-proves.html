function sortedTrades(arr=db.trade){return arr.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')||String(a.id).localeCompare(String(b.id)));}
function tradeAccounting(arr=db.trade){let positions=new Map(),results=[],ok=true;for(const t of sortedTrades(arr)){let key=String(t.asset||t.name||'').trim().toLowerCase();if(!key)continue;let h=positions.get(key)||{name:t.asset||t.name,qty:0,cost:0,lots:[]},q=n(t.qty||t.quantity),price=n(t.price),fees=n(t.fees);if(q<=0||price<0||fees<0){ok=false;continue;}if(t.type==='Venda'||t.type==='Sell'){if(q>h.qty+1e-7){ok=false;continue;}let remaining=q,costSold=0;for(const lot of h.lots){if(remaining<=1e-9)break;let take=Math.min(remaining,lot.qty),portion=take/lot.qty;costSold+=lot.cost*portion;lot.cost-=lot.cost*portion;lot.qty-=take;remaining-=take;}h.lots=h.lots.filter(l=>l.qty>1e-9);let gain=q*price-fees-costSold;results.push({id:t.id,date:t.date||'',asset:h.name,qty:q,profit:gain,proceeds:q*price-fees,costSold});}else{h.lots.push({qty:q,cost:q*price+fees});}h.qty=h.lots.reduce((sum,l)=>sum+l.qty,0);h.cost=h.lots.reduce((sum,l)=>sum+l.cost,0);positions.set(key,h);}return {positions:[...positions.values()].filter(h=>h.qty>1e-8),results,ok};}
function holdings(){return tradeAccounting().positions;}
function validTradeHistory(arr){return tradeAccounting(arr).ok;}
function investmentCash(){let flows=db.cashflows.reduce((s,x)=>s+(x.type==='Ingrés'?1:-1)*n(x.amount),0)+db.interest.reduce((s,x)=>s+n(x.amount),0),trades=db.trade.reduce((s,x)=>s+(x.type==='Venda'||x.type==='Sell'?1:-1)*n(x.qty||x.quantity)*n(x.price)-n(x.fees),0);return flows+trades;}

async function request(path,options={}){if(!cloud.url||!cloud.anon)throw Error('Configura Supabase primer.');let r=await fetch(cloud.url.replace(/\/$/,'')+path,{...options,headers:{apikey:cloud.anon,'Content-Type':'application/json',...(cloud.access?{Authorization:'Bearer '+cloud.access}:{}),...options.headers}});let raw=await r.text(),v;try{v=JSON.parse(raw);}catch{v=raw;}if(!r.ok)throw Error(v?.msg||v?.message||v?.error_description||'Error '+r.status);return v;}
async function login(email,password){let data=await request('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});cloud.email=email;cloud.access=data.access_token;cloud.refresh=data.refresh_token;cloud.expires=Date.now()+data.expires_in*1000;cloudSave();}
async function refreshAuth(){if(!cloud.refresh)throw Error('Inicia sessió');if(Date.now()<cloud.expires-60000)return;let d=await request('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloud.refresh})});cloud.access=d.access_token;cloud.refresh=d.refresh_token;cloud.expires=Date.now()+d.expires_in*1000;cloudSave();}
async function cloudPull(){await refreshAuth();let data=await request('/rest/v1/life_data?select=payload,updated_at&limit=1');if(data.length&&data[0].payload){db=normalize(data[0].payload);dataDirty=false;return true;}return false;}
async function openAccount(){const generation=++loadGeneration;authenticated=false;ready=false;showGate('Carregant dades del núvol...');try{await refreshAuth();let user=await request('/auth/v1/user');if(generation!==loadGeneration)return;currentUser=user.id;let found=await cloudPull();if(generation!==loadGeneration)return;
 if(!found){db=empty();let old=legacyData();if(old&&hasData(old)&&confirm('No hi ha dades al núvol. Vols recuperar les dades antigues d’aquest dispositiu?')){db=old;dataDirty=true;}}
 authenticated=true;ready=true;restoreDraft();page='Inici';render();status(found?'Dades recuperades del núvol':'Sessió iniciada · núvol sense dades');if(dataDirty)scheduleSync();
 }catch(err){if(generation!==loadGeneration)return;authenticated=false;ready=false;db=empty();showGate('No s’han pogut carregar les dades: '+err.message);}}
async function cloudPush(){if(!authenticated||!ready||!cloud.access||syncBusy||!dataDirty)return;syncBusy=true;clearTimeout(syncTimer);let snapshot=JSON.stringify(db);try{await refreshAuth();await request('/rest/v1/life_data?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:currentUser,payload:JSON.parse(snapshot),updated_at:new Date().toISOString()})});if(JSON.stringify(db)===snapshot)dataDirty=false;status('Sincronitzat al núvol · '+new Date().toLocaleTimeString('ca-ES',{hour:'2-digit',minute:'2-digit'}));}catch(err){status('Error de sincronització: '+err.message);}finally{syncBusy=false;if(dataDirty&&authenticated&&ready)scheduleSync(12000);}}
function scheduleSync(delay=1100){if(!authenticated||!ready)return;clearTimeout(syncTimer);syncTimer=setTimeout(cloudPush,delay);}
function signout(){++loadGeneration;clearTimeout(syncTimer);authenticated=false;ready=false;db=empty();activeWorkout=null;currentUser='';dataDirty=false;cloud.access='';cloud.refresh='';cloud.expires=0;cloudSave();showGate('Sessió tancada.');}
function privacy(){el().innerHTML=`<div class="card"><h2>Privacitat i sincronització</h2><div class="notice">Les dades del núvol estan protegides amb les polítiques RLS de Supabase. L'accés a MY LIFE requereix una sessió vàlida. La sessió es recorda en aquest navegador. Un dispositiu desbloquejat amb la sessió activa pot accedir a les dades.</div><h3>Còpia de seguretat</h3><div class="actions"><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><input class="hide" id="importfile" type="file" accept="application/json,.json"></div><p class="sub">El JSON no està xifrat. Desa'l en un lloc segur.</p></div><div class="card"><h2>El teu compte</h2><p>${esc(cloud.email||'Sessió iniciada')}</p><div class="actions"><button class="danger" id="signout">Tancar sessió</button></div></div><div class="card"><h2>Sincronització</h2><p class="sub">Les dades es recuperen en iniciar sessió i es desen automàticament després de cada canvi. Evita editar en dos dispositius alhora: l'última versió desada pot substituir l'anterior.</p><div class="actions"><button id="push">Sincronitzar ara</button><button id="pull">Recuperar dades del núvol</button></div><p id="syncmsg" class="sub"></p></div>`;
 document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-life-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 document.getElementById('import').onclick=()=>document.getElementById('importfile').click();document.getElementById('importfile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let v=JSON.parse(await f.text());if(!v||typeof v!=='object'||!Object.keys(empty()).some(k=>Array.isArray(v[k])))throw Error('Format incorrecte');if(confirm('Substituir les dades del compte amb aquesta còpia?')){db=normalize(v);save();render();}}catch(err){alert('No s’ha pogut importar: '+err.message);}};
 document.getElementById('signout').onclick=()=>{if(dataDirty&&!confirm('Hi ha canvis pendents de sincronitzar. Vols tancar sessió igualment?'))return;signout();};
 let sm=x=>{let e=document.getElementById('syncmsg');if(e)e.textContent=x;};
 document.getElementById('push').onclick=async()=>{dataDirty=true;sm('Sincronitzant...');await cloudPush();sm(document.getElementById('syncstatus').textContent);};
 document.getElementById('pull').onclick=async()=>{if(dataDirty){sm('Hi ha canvis locals pendents. Espera que se sincronitzin abans de recuperar dades.');return;}if(!confirm('Recuperar les dades del núvol?'))return;try{sm('Recuperant...');let found=await cloudPull();if(found){render();status('Dades recuperades del núvol');}else sm('No hi ha dades al núvol.');}catch(err){sm('Error: '+err.message);}};
}

/* MY LIFE V7 - entorn local de proves, aïllat de Supabase */
const V7_KEY='mylife_v7_sandbox_only';
const v7defaults=()=>({plans:[],tasks:[],habits:[],habitLog:[],goals:[],weights:[],bankChecks:[],settings:{homeOrder:['plans','habits','goals','sport'],homeOpen:['habits'],bankOpening:null}});
function v7init(){let v=v7defaults();try{v={...v,...JSON.parse(localStorage.getItem(V7_KEY)||'{}')};}catch(e){}for(let k of ['plans','tasks','habits','habitLog','goals','weights','bankChecks'])if(!Array.isArray(v[k]))v[k]=[];v.settings={...v7defaults().settings,...v.settings};return v;}
let v7=v7init(),lifeView='menu',lifeMonth=today().slice(0,7),lifeDay=today(),v7Edit=null;
function v7Save(){localStorage.setItem(V7_KEY,JSON.stringify(v7));}
function v7Go(p){page=p;render();}
function v7Btn(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;return b;}
function v7Date(d){return (d||'').slice(0,10);}
function v7Recurring(x,date){if(!x.repeat)return x.date===date;if(date<x.date||x.until&&date>x.until)return false;let wd=(new Date(date+'T12:00:00').getDay()+6)%7;return (x.days||[]).includes(wd);}
function v7Occurrences(date){return v7.plans.filter(x=>v7Recurring(x,date)&&!(x.excluded||[]).includes(date));}
function v7Tasks(date){return v7.tasks.filter(x=>!x.done&&(!x.date||x.date<=date));}
function v7HabitScheduled(h,date){return !h.start||date>=h.start ? (h.frequency==='daily'||(h.days||[]).includes((new Date(date+'T12:00:00').getDay()+6)%7)):false;}
function v7HabitLog(h,date){return v7.habitLog.find(x=>x.habitId===h.id&&x.date===date);}
function v7HabitStatus(h,date){let x=v7HabitLog(h,date);return x?.status||'pendent';}
function v7SetHabit(h,date,status,value){v7.habitLog=v7.habitLog.filter(x=>!(x.habitId===h.id&&x.date===date));if(status!=='pendent')v7.habitLog.push({id:id(),habitId:h.id,date,status,value:n(value)});v7Save();render();}
function v7GoalValue(g){if(g.mode!=='gym')return n(g.value);return db.workouts.filter(w=>(w.date||'').slice(0,4)===String(g.year)&&Array.isArray(w.exercises)&&w.exercises.some(e=>(e.sets||[]).some(t=>t.done))).length;}
function v7Goals(){let year=2027;let list=[{id:'gym2027',name:'Entrenaments de gimnàs',mode:'gym',year:2027,target:200},...v7.goals];el().innerHTML='<div class="card"><h2>🎯 Objectius anuals</h2><p>Els objectius automàtics compten sessions guardades amb sèries completades.</p>'+list.map(g=>{let v=v7GoalValue(g),pct=Math.min(100,100*v/Math.max(1,n(g.target)));return '<div class="exercise"><strong>'+esc(g.name)+'</strong> · '+esc(g.year)+'<p>'+v+' / '+esc(g.target)+' ('+fmt(pct,1)+'%) · Resten '+Math.max(0,n(g.target)-v)+'</p><div class="v7bar"><span style="width:'+pct+'%"></span></div>'+(g.id!=='gym2027'?'<button data-goaldel="'+g.id+'" class="danger">Eliminar</button>':'')+'</div>';}).join('')+'</div><div class="card"><h3>Nou objectiu manual</h3><form id="v7goal"><div class="grid">'+field('Nom','gname','text','','required')+field('Any','gyear','number','2027','required')+field('Objectiu numèric','gtarget','number','','min="1" required')+field('Progrés actual','gvalue','number','0','min="0"')+'</div><button class="primary">Afegir objectiu</button></form></div>';document.getElementById('v7goal').onsubmit=e=>{e.preventDefault();v7.goals.push({id:id(),name:val('gname'),year:n(val('gyear')),target:n(val('gtarget')),value:n(val('gvalue')),mode:'manual'});v7Save();v7Goals();};document.querySelectorAll('[data-goaldel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminar objectiu?')){v7.goals=v7.goals.filter(g=>g.id!==b.dataset.goaldel);v7Save();v7Goals();}});}
function v7Home(){let items={plans:['📅','Plans i tasques d’avui'],habits:['☑️','Hàbits d’avui'],goals:['🎯','Objectius anuals'],sport:['🏋️','Resum esportiu']};let order=v7.settings.homeOrder.filter(k=>items[k]);el().innerHTML='<div class="card"><h2>El meu dia</h2><p>Versió de proves · Les dades són locals i no es sincronitzen amb Supabase.</p><button id="v7order">Personalitzar ordre</button></div>'+order.map(k=>'<div class="card"><button class="v7head" data-toggle="'+k+'"><strong>'+items[k][0]+' '+items[k][1]+'</strong><span>'+(v7.settings.homeOpen.includes(k)?'⌃':'⌄')+'</span></button><div id="v7body-'+k+'">'+(v7.settings.homeOpen.includes(k)?v7HomePart(k):'')+'</div></div>').join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let k=b.dataset.toggle,a=v7.settings.homeOpen;v7.settings.homeOpen=a.includes(k)?a.filter(x=>x!==k):[...a,k];v7Save();v7Home();});document.getElementById('v7order').onclick=()=>{let html=order.map((k,i)=>'<div class="item">'+items[k][1]+' <div><button data-move="'+i+':-1" '+(i===0?'disabled':'')+'>↑</button><button data-move="'+i+':1" '+(i===order.length-1?'disabled':'')+'>↓</button></div></div>').join('');el().innerHTML='<div class="card"><h2>Ordenar Inici</h2>'+html+'<button id="orderback">Tornar</button></div>';document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{let [i,d]=b.dataset.move.split(':').map(Number),a=v7.settings.homeOrder,j=i+d;[a[i],a[j]]=[a[j],a[i]];v7Save();v7Home();document.getElementById('v7order').click();});document.getElementById('orderback').onclick=v7Home;};document.querySelectorAll('[data-taskquick]').forEach(b=>b.onclick=()=>{let t=v7.tasks.find(x=>x.id===b.dataset.taskquick);if(t){t.done=true;t.completedAt=today();v7Save();v7Home();}});document.querySelectorAll('[data-habitquick]').forEach(b=>b.onclick=()=>{let h=v7.habits.find(x=>x.id===b.dataset.habitquick);if(h)v7SetHabit(h,today(),'fet',h.target||1);});document.querySelectorAll('[data-routinequick]').forEach(b=>b.onclick=()=>{let p=v7.plans.find(x=>x.id===b.dataset.routinequick);if(p?.routineId){sport='Gimnàs';startWorkout(p.routineId);page='Esport';render();}});}
function v7HomePart(k){let d=today();if(k==='plans')return '<div>'+v7Occurrences(d).map(p=>'<p>'+esc(p.time||'')+' '+esc(p.name)+(p.routineId?'<button data-routinequick="'+p.id+'">Iniciar rutina</button>':'')+'</p>').join('')+v7Tasks(d).map(t=>'<label class="check"><input type="checkbox" data-taskquick="'+t.id+'">'+esc(t.name)+(t.date<d?' · Endarrerida':'')+'</label>').join('')+'</div><button onclick="v7Go(\'Vida\')">Veure planificació</button>';if(k==='habits')return v7.habits.filter(h=>v7HabitScheduled(h,d)).map(h=>'<div class="item"><span>'+esc(h.name)+' · '+v7HabitStatus(h,d)+'</span><button data-habitquick="'+h.id+'">✓ Fet</button></div>').join('')+'<button onclick="v7Go(\'Vida\')">Veure hàbits</button>';if(k==='goals')return '<p>Gimnàs 2027: '+v7GoalValue({mode:'gym',year:2027})+' / 200</p><button onclick="v7Go(\'Objectius\')">Veure objectius</button>';let week=new Date();week.setDate(week.getDate()-6);let start=week.toLocaleDateString('en-CA');return '<div class="stats"><div class="stat"><small>Gimnàs (7 dies)</small><strong>'+db.workouts.filter(x=>x.date>=start).length+'</strong></div><div class="stat"><small>Bici (7 dies)</small><strong>'+fmt(db.bike.filter(x=>x.date>=start).reduce((a,x)=>a+n(x.km),0),1)+' km</strong></div><div class="stat"><small>Running (7 dies)</small><strong>'+fmt(db.running.filter(x=>x.date>=start).reduce((a,x)=>a+n(x.km),0),1)+' km</strong></div></div><button onclick="v7Go(\'Esport\')">Veure Esport</button>';}
function v7Life(){if(lifeView==='menu'){el().innerHTML=menu('Vida',[['calendar','📅','Planificació','Calendari i activitats'],['tasks','☑️','Tasques','Pendents i prioritats'],['habits','🔁','Hàbits','Seguiment diari']]);document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{lifeView=b.dataset.view;v7Life();});return;}if(lifeView==='calendar')v7Calendar();else if(lifeView==='tasks')v7TaskPage();else v7HabitsPage();}

function v7Calendar(){let first=new Date(lifeMonth+'-01T12:00:00'),days=new Date(first.getFullYear(),first.getMonth()+1,0).getDate(),offset=(first.getDay()+6)%7;let cells=Array.from({length:offset},()=>'<div></div>').concat(Array.from({length:days},(_,i)=>{let d=lifeMonth+'-'+String(i+1).padStart(2,'0'),count=v7Occurrences(d).length+v7.tasks.filter(t=>t.date===d).length;return '<button class="v7day '+(lifeDay===d?'selected':'')+'" data-day="'+d+'">'+(i+1)+(count?'<small>• '+count+'</small>':'')+'</button>';}));let selected=v7Occurrences(lifeDay);el().innerHTML=v7LifeBack()+'<div class="card"><h2>📅 Planificació</h2><div class="actions"><button id="prevmonth">←</button><strong>'+esc(lifeMonth)+'</strong><button id="nextmonth">→</button></div><div class="calendar">'+['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map(x=>'<div class="calweekday">'+x+'</div>').join('')+cells.join('')+'</div></div><div class="card"><h3>'+esc(lifeDay)+'</h3>'+selected.map(p=>'<div class="item"><div><strong>'+esc(p.name)+'</strong><small>'+esc(p.time||'')+' · '+esc(p.category||'Personal')+'</small></div><div>'+(p.routineId?'<button data-start="'+p.routineId+'">▶ Rutina</button>':'')+'<button data-plandel="'+p.id+'" class="danger">×</button></div></div>').join('')+'<p class="sub">Tasques: '+v7.tasks.filter(t=>t.date===lifeDay).length+'</p></div><div class="card"><h3>Afegir pla</h3><form id="planform"><div class="grid">'+field('Nom','pname','text','','required')+field('Data inicial','pdate','date',lifeDay,'required')+field('Hora','ptime','time','16:30')+select('Categoria','pcategory',['Personal','Esport','Feina','Oci','Altres'],'Personal')+select('Rutina vinculada','proutine',['Cap',...db.routines.map(x=>x.name)],'Cap')+field('Lloc','pplace','text','')+field('Notes','pnotes','text','')+field('Repetir fins al (opcional)','puntil','date','')+'</div><label class="check"><input id="prepeat" type="checkbox"> Repetir setmanalment</label><div class="v7week">'+['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map((x,i)=>'<label><input type="checkbox" name="pdays" value="'+i+'">'+x+'</label>').join('')+'</div><label class="check"><input id="premind" type="checkbox"> Recordatori opcional (configuració de prova)</label><button class="primary">Desar pla</button></form></div>';v7BindBack();document.getElementById('prevmonth').onclick=()=>{let d=new Date(lifeMonth+'-01T12:00:00');d.setMonth(d.getMonth()-1);lifeMonth=d.toLocaleDateString('en-CA').slice(0,7);v7Calendar();};document.getElementById('nextmonth').onclick=()=>{let d=new Date(lifeMonth+'-01T12:00:00');d.setMonth(d.getMonth()+1);lifeMonth=d.toLocaleDateString('en-CA').slice(0,7);v7Calendar();};document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{lifeDay=b.dataset.day;v7Calendar();});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{sport='Gimnàs';startWorkout(b.dataset.start);page='Esport';render();});document.querySelectorAll('[data-plandel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminar aquest pla repetitiu o individual?')){v7.plans=v7.plans.filter(x=>x.id!==b.dataset.plandel);v7Save();v7Calendar();}});document.getElementById('planform').onsubmit=e=>{e.preventDefault();let name=val('proutine'),r=db.routines.find(x=>x.name===name),repeat=document.getElementById('prepeat').checked,days=[...document.querySelectorAll('[name=pdays]:checked')].map(x=>n(x.value));if(repeat&&!days.length){alert('Selecciona almenys un dia de la setmana.');return;}v7.plans.push({id:id(),name:val('pname'),date:val('pdate'),time:val('ptime'),category:val('pcategory'),routineId:r?.id||null,place:val('pplace'),notes:val('pnotes'),repeat,days,until:val('puntil'),remind:document.getElementById('premind').checked});v7Save();lifeDay=val('pdate');lifeMonth=lifeDay.slice(0,7);v7Calendar();};}
function v7TaskPage(){let cat=window.v7Cat||'Totes',state=window.v7State||'Tots',priority=window.v7Priority||'Totes';let filtered=v7.tasks.filter(t=>(cat==='Totes'||t.category===cat)&&(priority==='Totes'||(t.priority||'Cap')===priority)&&(state==='Tots'||(state==='Completades'?t.done:state==='Endarrerides'?!t.done&&t.date&&t.date<today():!t.done)));filtered.sort((a,b)=>(a.done-b.done)||String(a.date||'9999').localeCompare(b.date||'9999'));el().innerHTML=v7LifeBack()+'<div class="card"><h2>☑️ Tasques</h2><div class="grid">'+select('Categoria','filtercat',['Totes','Personal','Feina','Esport','Oci','Altres'],cat)+select('Estat','filterstate',['Tots','Pendents','Endarrerides','Completades'],state)+select('Prioritat','filterpriority',['Totes','Alta','Mitjana','Baixa','Cap'],priority)+'</div>'+filtered.map(t=>'<div class="item"><label class="check"><input type="checkbox" data-taskdone="'+t.id+'" '+(t.done?'checked':'')+'><span>'+esc(t.name)+'<small>'+esc(t.category)+' · '+esc(t.date||'Sense data')+' · '+esc(t.priority||'Sense prioritat')+(t.date<today()&&!t.done?' · ⚠ Endarrerida':'')+'</small></span></label><button data-taskdel="'+t.id+'" class="danger">×</button></div>').join('')+'</div><div class="card"><h3>Nova tasca</h3><form id="taskform"><div class="grid">'+field('Nom','tname','text','','required')+field('Data límit (opcional)','tdate','date','')+select('Categoria','tcat',['Personal','Feina','Esport','Oci','Altres'],'Personal')+select('Prioritat','tpriority',['Cap','Alta','Mitjana','Baixa'],'Cap')+field('Notes','tnotes','text','')+'</div><label class="check"><input id="tremind" type="checkbox"> Recordatori opcional</label><button class="primary">Afegir tasca</button></form></div>';v7BindBack();for(let [a,b] of [['filtercat','v7Cat'],['filterstate','v7State'],['filterpriority','v7Priority']])document.getElementById(a).onchange=e=>{window[b]=e.target.value;v7TaskPage();};document.querySelectorAll('[data-taskdone]').forEach(b=>b.onchange=()=>{let t=v7.tasks.find(x=>x.id===b.dataset.taskdone);t.done=b.checked;t.completedAt=t.done?today():null;v7Save();v7TaskPage();});document.querySelectorAll('[data-taskdel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminar tasca?')){v7.tasks=v7.tasks.filter(t=>t.id!==b.dataset.taskdel);v7Save();v7TaskPage();}});document.getElementById('taskform').onsubmit=e=>{e.preventDefault();v7.tasks.push({id:id(),name:val('tname'),date:val('tdate'),category:val('tcat'),priority:val('tpriority'),notes:val('tnotes'),remind:document.getElementById('tremind').checked,done:false});v7Save();v7TaskPage();};}
function v7HabitsPage(){let d=lifeDay;el().innerHTML=v7LifeBack()+'<div class="card"><h2>🔁 Hàbits</h2>'+field('Dia','habitdate','date',d)+v7.habits.filter(h=>v7HabitScheduled(h,d)).map(h=>{let log=v7HabitLog(h,d);return '<div class="exercise"><strong>'+esc(h.name)+'</strong><p>'+esc(h.type==='quantity'?h.target+' '+h.unit:'Sí / No')+' · '+esc(log?.status||'Pendent')+'</p>'+(h.type==='quantity'?'<input type="number" step="any" min="0" id="hv-'+h.id+'" value="'+esc(log?.value||'')+'" placeholder="Quantitat feta">':'')+'<div class="actions"><button data-hdone="'+h.id+'">✓ Fet</button><button data-hrest="'+h.id+'">Descans justificat</button><button data-hclear="'+h.id+'">Desfer</button><button data-hdel="'+h.id+'" class="danger">Eliminar</button></div></div>';}).join('')+'</div><div class="card"><h3>Nou hàbit</h3><form id="habitform"><div class="grid">'+field('Nom','hname','text','','required')+select('Tipus','htype',['Sí / No','Quantitat'],'Sí / No')+field('Objectiu quantitatiu','htarget','number','1','min="0" step="any"')+field('Unitat (min, pàgines...)','hunit','text','')+select('Freqüència','hfrequency',['Cada dia','Dies seleccionats'],'Cada dia')+'</div><div class="v7week">'+['Dl','Dt','Dc','Dj','Dv','Ds','Dg'].map((x,i)=>'<label><input type="checkbox" name="hdays" value="'+i+'">'+x+'</label>').join('')+'</div><label class="check"><input id="hremind" type="checkbox"> Recordatori opcional</label><button class="primary">Afegir hàbit</button></form></div>';v7BindBack();document.getElementById('habitdate').onchange=e=>{lifeDay=e.target.value;v7HabitsPage();};for(let [attr,status] of [['hdone','fet'],['hrest','justificat'],['hclear','pendent']])document.querySelectorAll('[data-'+attr+']').forEach(b=>b.onclick=()=>{let h=v7.habits.find(x=>x.id===b.dataset[attr]);v7SetHabit(h,d,status,document.getElementById('hv-'+h.id)?.value||h.target||1);v7HabitsPage();});document.querySelectorAll('[data-hdel]').forEach(b=>b.onclick=()=>{if(confirm('Eliminar hàbit i historial?')){v7.habits=v7.habits.filter(x=>x.id!==b.dataset.hdel);v7.habitLog=v7.habitLog.filter(x=>x.habitId!==b.dataset.hdel);v7Save();v7HabitsPage();}});document.getElementById('habitform').onsubmit=e=>{e.preventDefault();let days=[...document.querySelectorAll('[name=hdays]:checked')].map(x=>n(x.value)),freq=val('hfrequency');if(freq==='Dies seleccionats'&&!days.length){alert('Selecciona els dies.');return;}v7.habits.push({id:id(),name:val('hname'),type:val('htype')==='Quantitat'?'quantity':'binary',target:n(val('htarget'))||1,unit:val('hunit'),frequency:freq==='Cada dia'?'daily':'days',days,start:today(),remind:document.getElementById('hremind').checked});v7Save();v7HabitsPage();};}
function v7GymExtra(root,view,backBtn){if(view==='pes'){let a=[...v7.weights].sort((x,y)=>y.date.localeCompare(x.date));root.innerHTML=backBtn+'<div class="card"><h2>⚖️ Evolució del pes</h2><form id="weightform"><div class="grid">'+field('Data','wdate','date',today(),'required')+field('Pes (kg)','wkg','number','','min="1" step="0.1" required')+'</div><button class="primary">Desar pes</button></form>'+a.map(w=>'<div class="item">'+esc(w.date)+' · '+fmt(w.kg,1)+' kg <button data-wdel="'+w.id+'" class="danger">×</button></div>').join('')+'</div>';document.getElementById('weightform').onsubmit=e=>{e.preventDefault();v7.weights.push({id:id(),date:val('wdate'),kg:n(val('wkg'))});v7Save();gym();};document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{v7.weights=v7.weights.filter(w=>w.id!==b.dataset.wdel);v7Save();gym();});}else{let m=new Map();for(let w of db.workouts)for(let e of w.exercises||[])for(let t of e.sets||[])if(t.done){let x=m.get(e.name)||{max:0,reps:{}};x.max=Math.max(x.max,n(t.kg));x.reps[String(t.kg)]=Math.max(x.reps[String(t.kg)]||0,n(t.reps));m.set(e.name,x);}root.innerHTML=backBtn+'<div class="card"><h2>🏆 Rècords històrics</h2>'+([...m].map(([name,x])=>'<div class="exercise"><strong>'+esc(name)+'</strong><p>Pes màxim: '+fmt(x.max,1)+' kg</p><small>Repeticions per pes: '+Object.entries(x.reps).map(([kg,r])=>esc(kg)+' kg × '+r).join(' · ')+'</small></div>').join('')||'<p>Encara no hi ha sèries completades.</p>')+'</div>';}root.querySelector('.backbtn').onclick=()=>{gymView='menu';gym();};}
function v7FinanceLinks(){let card=el().firstElementChild;if(!card)return;let bar=document.createElement('div');bar.className='card';bar.innerHTML='<h2>Finances · V7</h2><div class="actions"><button id="v7invest">📈 Inversions</button><button id="v7wealth">🏦 Patrimoni i conciliació</button></div>';card.before(bar);document.getElementById('v7invest').onclick=()=>v7Go('Inversions');document.getElementById('v7wealth').onclick=()=>v7Go('Patrimoni');}
function v7BankBalance(month){let base=n(v7.settings.bankOpening);return base+db.money.filter(x=>x.method==='Targeta'&&x.date>='2027-01-01'&&x.date<=month+'-31').reduce((s,x)=>s+(x.type==='Ingrés'?1:-1)*n(x.amount),0);}
function v7Wealth(){let hs=holdings(),value=hs.reduce((s,x)=>s+n(x.cost),0),cash=investmentCash(),last=[...v7.bankChecks].sort((a,b)=>b.month.localeCompare(a.month))[0],bank=last?n(last.actual):v7BankBalance(today().slice(0,7));el().innerHTML='<div class="card"><h2>🏦 Patrimoni</h2><p class="notice">Valor d’inversions provisional a cost d’adquisició, no cotització de mercat. Cal introduir valoracions reals per calcular el patrimoni exacte.</p><div class="stats"><div class="stat"><small>Banc · Targeta</small><strong>'+money(bank)+'</strong></div><div class="stat"><small>Trade Republic · efectiu</small><strong>'+money(cash)+'</strong></div><div class="stat"><small>Inversions · cost</small><strong>'+money(value)+'</strong></div><div class="stat"><small>Total provisional</small><strong>'+money(bank+cash+value)+'</strong></div></div></div><div class="card"><h3>Conciliació mensual</h3><form id="bankform"><div class="grid">'+field('Saldo inicial Targeta 01/01/2027 (€)','bankopening','number',v7.settings.bankOpening??'','step="0.01"')+field('Mes','bankmonth','month',today().slice(0,7),'required')+field('Saldo real al final del mes (€)','bankactual','number','','step="0.01" required')+'</div><button class="primary">Registrar comprovació</button></form>'+v7.bankChecks.map(x=>'<div class="item"><div><strong>'+esc(x.month)+'</strong><small>Real: '+money(x.actual)+' · Calculat: '+money(x.calculated)+' · Diferència: '+money(x.actual-x.calculated)+'</small></div><span class="pill">'+(Math.abs(x.actual-x.calculated)<0.005?'Quadrat':'Revisar')+'</span></div>').join('')+'</div>';document.getElementById('bankform').onsubmit=e=>{e.preventDefault();if(val('bankopening')!=='')v7.settings.bankOpening=n(val('bankopening'));let month=val('bankmonth');v7.bankChecks=v7.bankChecks.filter(x=>x.month!==month);v7.bankChecks.push({id:id(),month,actual:n(val('bankactual')),calculated:v7BankBalance(month)});v7Save();v7Wealth();};}
function v7Privacy(){el().innerHTML='<div class="card"><h2>🔒 MY LIFE V7 · Entorn de proves</h2><p>Aquesta branca no inicia sessió a Supabase i no escriu cap dada al projecte real. Els registres d’aquesta prova només es desen al navegador d’aquest dispositiu.</p><button id="v7export">Exportar dades de proves</button></div>';document.getElementById('v7export').onclick=()=>{let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify({v7,db},null,2)],{type:'application/json'}));a.href=url;a.download='my-life-v7-proves.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};}

// Sandbox local: no es recupera ni s'envia cap dada a Supabase.
cloud.access='';cloud.refresh='';cloud.url='';cloud.anon='';authenticated=true;ready=true;currentUser='v7-sandbox';try{db=normalize(JSON.parse(localStorage.getItem('mylife_v7_demo_db')||'{}'));}catch(e){db=empty();}restoreDraft();scheduleSync=function(){localStorage.setItem('mylife_v7_demo_db',JSON.stringify(db));dataDirty=false;};document.getElementById('syncstatus').textContent='🧪 V7 · proves locals, sense Supabase';render();
</script></body></html>
